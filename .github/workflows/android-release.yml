name: Android Release (universal arm32+arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "port/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python deps
        run: python3 -m pip install --quiet pillow

      - name: Install simulator dependencies (Mesa EGL/GLES)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgles2 libegl-mesa0

      - name: Simulate the device and run the UI scenarios
        # Runs the packaged engine on Linux with Android code paths on
        # (port/sim): launch/return, launcher tools, New Project, errors,
        # missing storage permission. A crash fails the build before an
        # APK is ever released.
        run: |
          sh port/sim/build_and_package.sh
          python3 port/sim/run_scenarios.py --shots "$BUILD_WORK/sim-shots"
        env:
          BUILD_WORK: ${{ github.workspace }}/build-work

      - name: Upload simulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: |
            build-work/sim-shots/
            build-work/sim-*.log
          if-no-files-found: ignore

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Prepare release keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/renpy.keystore"
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Build universal APK (launcher + on-device development)
        run: python3 port/build_android.py
        env:
          RENPY_KEYSTORE: ${{ github.workspace }}/renpy.keystore
          RENPY_STORE_PASSWORD: ${{ secrets.RENPY_RELEASE_STORE_PASSWORD }}
          RENPY_KEY_ALIAS: ${{ secrets.RENPY_RELEASE_KEY_ALIAS }}
          BUILD_WORK: ${{ github.workspace }}/build-work
          BUILD_OUT: ${{ github.workspace }}/out

      - name: Summarize
        run: |
          cd out
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: renpy-engine-android-apk
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="engine-v8.6.1-build.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" \
            --title "Ren'Py Engine 8.6.1 - universal Android APK (arm32+arm64)" \
            --notes "Ren'Py launcher packaged for on-device development. Projects and launcher tools (Navigate Script, Lint, Force Recompile, Delete Persistent, Change GUI, New Project, translations, Extract Dialogue) run in-process and always return to the launcher; a '< Launcher' button leaves running projects; project errors show Ren'Py's error screen and never close the app; built-in file viewer with 'Open in editor app'. Projects live in /storage/emulated/0/RenPyProjects (tap 'Grant file access'), or in the app's own folder until access is granted. If the app ever closes, see renpy_crash.txt in the projects folder." \
            out/*.apk out/SHA256SUMS.txt
